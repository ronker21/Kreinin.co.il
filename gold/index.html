<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GoldCalc</title>
<meta name="description" content="Gold weight, market value and asking price calculator.">
<link rel="canonical" href="https://www.kreinin.co.il/gold/">
<link rel="stylesheet" href="gold.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
<header><h1>GoldCalc</h1><span>by RonK</span></header>
<noscript><p class="error">Enable JavaScript to use GoldCalc.</p></noscript>
<section class="card market" aria-labelledby="market-title">
<div class="card-heading"><h2 id="market-title">Live Market Data</h2><button id="refresh" type="button" aria-label="Refresh market data" title="Refresh market data">↻</button></div>
<div class="row"><span>Gold (XAU/USD):</span><strong id="spot-display" class="gold">—</strong></div>
<div class="row"><span>USD/ILS Rate:</span><span id="fx-display" class="muted">—</span></div>
<p id="market-status" class="status" role="status"></p>
<details id="manual-details"><summary>Manual rates</summary>
<form id="rates-form"><label for="manual-spot">Gold · USD / troy oz</label><input id="manual-spot" type="text" inputmode="decimal" autocomplete="off" required maxlength="24"><label for="manual-fx">USD/ILS</label><input id="manual-fx" type="text" inputmode="decimal" autocomplete="off" required maxlength="24"><p id="rates-error" class="error" role="alert"></p><button type="submit" class="apply">Apply</button></form>
</details>
</section>
<form id="calculator" novalidate>
<section class="card"><h2><label for="weight">Weight</label></h2><div class="input-row"><input id="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" maxlength="24" aria-describedby="weight-error"><select id="unit" aria-label="Weight unit"><option value="gram">Gram</option><option value="ounce">Ounce (oz)</option><option value="troy">Troy Oz</option><option value="kilo">Kilo</option></select></div><p id="weight-error" class="error"></p></section>
<fieldset class="card karat"><legend class="sr-only">Karat</legend><h2 aria-hidden="true">Karat</h2><div class="segmented"><label><input type="radio" name="karat" value="24"><span>24K</span></label><label><input type="radio" name="karat" value="22" checked><span>22K</span></label><label><input type="radio" name="karat" value="18"><span>18K</span></label><label><input type="radio" name="karat" value="14"><span>14K</span></label></div></fieldset>
<section class="card"><h2><label for="asking">Asking Price</label></h2><div class="input-row"><input id="asking" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" maxlength="24" aria-describedby="asking-error"><select id="currency" aria-label="Asking price currency"><option value="USD">USD</option><option value="ILS">ILS</option></select></div><p id="asking-error" class="error"></p></section>
<section class="card totals" aria-labelledby="total-title"><h2 id="total-title">Total Market Value</h2><div class="row"><span>Value in USD:</span><output id="value-usd" class="gold">—</output></div><div class="row"><span>Value in Shekel:</span><output id="value-ils" class="blue">—</output></div></section>
<section class="card" id="comparison-results" aria-labelledby="comparison-title" hidden><h2 id="comparison-title">Deal Analysis (USD)</h2><div class="row"><span>Price per Gram:</span><output id="per-gram"></output></div><div class="row"><span id="difference-label">Premium (Over):</span><output id="difference"></output></div></section>
<p id="result-announcement" class="sr-only" role="status" aria-live="polite"></p>
</form>
</main>
</body>
</html>
